name: Check card prices

on:
  schedule:
    # Every 2 hours. Adjust as you like: https://crontab.guru
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      card_name:
        description: "Look up one specific card right now (leave blank to refresh all tracked cards)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Run bot
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: |
          cd bot
          if [ -n "${{ github.event.inputs.card_name }}" ]; then
            python main.py "${{ github.event.inputs.card_name }}"
          else
            python main.py
          fi

      - name: Commit updated data
        run: |
          git config user.name "card-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deals.json
          git diff --staged --quiet || git commit -m "Update card prices"
          git push
